# import PageOrder from '/packages/app-lixi-api/schema.graphql'
# import PageInfoFields from '../../graphql/fragments/page-info-fields.fragment.graphql'
# import BasicPageInfoFields from '../../graphql/fragments/basic-page-info-fields.fragment.graphql'

query Page($id: String!) {
  page(id: $id) {
    ...PageFields
  }
}

query Pages(
  $after: String
  $before: String
  $first: Int = 20
  $last: Int
  $skip: Int
) {
  allPages(
    after: $after
    before: $before
    first: $first
    last: $last
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...PageFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query PagesByFollower($after: String, $first: Int = 20) {
  pagesByFollower(after: $after, first: $first) {
    totalCount
    edges {
      cursor
      node {
        ...PageFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query PagesByUserId($after: String, $first: Int = 20, $id: Int, $skip: Int) {
  allPagesByUserId(after: $after, first: $first, id: $id, skip: $skip) {
    totalCount
    edges {
      cursor
      node {
        ...PageFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

fragment PageFields on Page {
  id
  pageAccountId
  pageAccount {
    id
    name
    address
  }
  name
  title
  categoryId
  category {
    id
    name
  }
  description
  avatar
  cover
  parentId
  countryId
  countryName
  stateId
  stateName
  address
  website
  dana {
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
    version
  }
  totalBurnForPage
  followersCount
  createPostFee
  createCommentFee
  createdAt
  updatedAt
  totalPostsBurnUp
  totalPostsBurnDown
  totalPostsBurnScore
  postViews
}

mutation createPage($input: CreatePageInput!) {
  createPage(data: $input) {
    ...PageFields
  }
}

mutation updatePage($input: UpdatePageInput!) {
  updatePage(data: $input) {
    ...PageFields
  }
}
