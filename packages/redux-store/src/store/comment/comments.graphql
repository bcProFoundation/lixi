# import CommentOrder from '/packages/app-lixi-api/schema.graphql'
# import PageInfoFields from '../../graphql/fragments/page-info-fields.fragment.graphql'

query Comment($id: String!) {
  comment(id: $id) {
    ...ReplyCommentFields
  }
}

query CommentsToCommentableId(
  $after: String
  $before: String
  $first: Int = 20
  $last: Int
  $orderBy: CommentOrder
  $id: String
  $skip: Int
) {
  commentsToCommentableId(
    after: $after
    before: $before
    first: $first
    last: $last
    orderBy: $orderBy
    id: $id
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...ReplyCommentFields
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

fragment CommentFields on Comment {
  id
  commentText
  commentAccount {
    address
    id
    name
    avatar
  }
  commentByPublicKey
  commentableId
  danaBurnUp
  danaBurnDown
  danaBurnScore
  commentDana {
    danaBurnUp
    danaBurnDown
    danaBurnScore
    version
  }
  imageUploadable {
    id
    uploads {
      id
      width
      height
      cfImageId
      cfImageFilename
    }
  }
  createdAt
  updatedAt
  commentable {
    id
    type
    commentToId
  }
  parentId
}

fragment ReplyCommentFields on Comment {
  ...CommentFields
  parent {
    ...CommentFields
  }
}

mutation createComment($input: CreateCommentInput!) {
  createComment(data: $input) {
    ...CommentFields
  }
}

mutation createReplyComment($input: CreateCommentInput!) {
  createReplyComment(data: $input) {
    ...ReplyCommentFields
  }
}
