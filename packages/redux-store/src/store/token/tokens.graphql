# import TokenOrder from '/packages/app-lixi-api/schema.graphql'
# import TokenInfoFields from '../../graphql/fragments/token-info-fields.fragment.graphql'
# import BasicPageInfoFields from '../../graphql/fragments/basic-page-info-fields.fragment.graphql'

query Token($id: String!) {
  token(id: $id) {
    ...TokenFields
  }
}

query TokenByTokenId($tokenId: String!) {
  tokenByTokenId(tokenId: $tokenId) {
    ...TokenFields
  }
}

query Tokens($after: String, $first: Int = 20, $skip: Int) {
  allTokens(after: $after, first: $first, skip: $skip) {
    totalCount
    edges {
      node {
        ...TokenFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

fragment TokenFields on Token {
  id
  tokenId
  tokenType
  name
  ticker
  decimals
  tokenDocumentUrl
  totalBurned
  totalMinted
  followersCount
  followScore
  dana {
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
    version
  }
  initialTokenQuantity
  comments
  createdDate
  isFollowed
}

mutation createToken($input: CreateTokenInput!) {
  createToken(data: $input) {
    ...TokenFields
  }
}
