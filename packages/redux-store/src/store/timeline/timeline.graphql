# import PageInfoFields from '../../graphql/fragments/page-info-fields.fragment.graphql'
# import PostFields from '../post/posts.graphql
# import BasicPageInfoFields from '../../graphql/fragments/basic-page-info-fields.fragment.graphql'

query Timeline($id: String!) {
  timeline(id: $id) {
    id
    data {
      __typename
      ... on Post {
        ...PostFields
      }
    }
  }
}

query HomeTimeline(
  $after: String
  $first: Int = 20
  $level: Int
) {
  homeTimeline(
    after: $after
    first: $first
    level: $level
  ) {
    totalCount
    edges {
      cursor
      node {
        id
        data {
          __typename
          ... on Post {
            ...PostFields
          }
        }
        
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

