# import PageInfoFields from '../../graphql/fragments/page-info-fields.fragment.graphql'
# import PostFields from '../post/posts.graphql
# import BasicPageInfoFields from '../../graphql/fragments/basic-page-info-fields.fragment.graphql'

fragment EscrowOrderFields on EscrowOrder {
  id
  message
  arbitratorAccount {
    id
    publicKey
    hash160
    telegramId
    telegramUsername
  }
  buyerAccount {
    id
    publicKey
    hash160
    telegramId
    telegramUsername
  }
  sellerAccount {
    id
    publicKey
    hash160
    telegramId
    telegramUsername
  }
  moderatorAccount {
    id
    publicKey
    hash160
    telegramId
    telegramUsername
  }
  paymentMethod {
    id
    name
  }
  escrowOffer: offer {
    postId
    message
  }
  escrowScript
  escrowAddress
  nonce
  escrowTxids {
    txid
    value
    outIdx
  }
  dispute {
    id
    createdBy
    reason
    status
  }
  releaseTxid
  returnTxid
  price
  amount
  escrowOrderStatus: status
  createdAt
  updatedAt
}

fragment DisputeFields on Dispute {
  id
  escrowOrder {
    amount
    id
    buyerAccount {
      telegramUsername
    }
    sellerAccount {
      telegramUsername
    }
    offer {
      message
      country {
        name
      }
      state {
        name
      }
      createdAt
    }
  }
  reason
  createdBy
  disputeStatus: status
  createdAt
  updatedAt
}

fragment TimelineItemFields on TimelineItem {
  id
  data {
    __typename
    ... on Post {
      ...PostFields
    }
    ... on EscrowOrder {
      ...EscrowOrderFields
    }
    ... on Dispute {
      ...DisputeFields
    }
  }
}

query Timeline($id: String!) {
  timeline(id: $id) {
    ...TimelineItemFields
  }
}

query HomeTimeline($after: String, $first: Int = 20, $level: Int) {
  homeTimeline(after: $after, first: $first, level: $level) {
    totalCount
    edges {
      cursor
      node {
        ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

