query EscrowOrder($id: String!) {
  escrowOrder(id: $id) {
    ...EscrowOrderFields
  }
}

query GetModeratorAccount {
  getModeratorAccount {
    ...AccountFields
  }
}

query GetRandomArbitratorAccount {
  getRandomArbitratorAccount {
    ...AccountFields
  }
}

query AllEscrowOrderByAccount($first: Int = 20, $after: String, $escrowOrderStatus: EscrowOrderStatus!) {
  allEscrowOrderByAccount(first: $first, after: $after, escrowOrderStatus: $escrowOrderStatus) {
    totalCount
    edges {
      cursor
      node {
        ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query AllEscrowOrderByOfferId(
  $offerId: String!
  $escrowOrderStatus: EscrowOrderStatus!
  $first: Int = 20
  $after: String
) {
  allEscrowOrderByOfferId(first: $first, after: $after, offerId: $offerId, escrowOrderStatus: $escrowOrderStatus) {
    totalCount
    edges {
      cursor
      node {
        ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query UserRequestTelegramChat($id: String!) {
  userRequestTelegramChat(id: $id)
}

query ArbiRequestTelegramChat($requestChatPublicKey: String!, $escrowOrderId: String!) {
  arbiRequestTelegramChat(requestChatPublicKey: $requestChatPublicKey, escrowOrderId: $escrowOrderId)
}

mutation CreateEscrowOrder($input: CreateEscrowOrderInput!) {
  createEscrowOrder(data: $input) {
    id
  }
}

mutation UpdateEscrowOrderStatus($input: UpdateEscrowOrderInput!) {
  updateEscrowOrderStatus(data: $input) {
    id
    message
    price
    amount
    status
    createdAt
    updatedAt
  }
}

mutation FilterUtxos($input: [UtxoInNodeInput!]!, $hash160: String!) {
  filterUtxos(data: $input, hash160: $hash160) {
    txid
    outIdx
    value
  }
}
