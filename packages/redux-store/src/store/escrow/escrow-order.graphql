fragment EscrowOrderFields on EscrowOrder {
  id
  message
  arbitratorAccount {
    id
    publicKey
    hash160
    telegramId
  }
  buyerAccount {
    id
    publicKey
    hash160
    telegramId
  }
  sellerAccount {
    id
    publicKey
    hash160
    telegramId
  }
  moderatorAccount {
    id
    publicKey
    hash160
    telegramId
  }
  paymentMethod {
    id
    name
  }
  offer {
    postId
    message
  }
  escrowScript
  escrowAddress
  nonce
  escrowTxids {
    txid
    value
  }
  dispute {
    createdBy
    reason
    status
  }
  releaseTxid
  returnTxid
  price
  amount
  status
  createdAt
  updatedAt
}

query EscrowOrder($id: String!) {
  escrowOrder(id: $id) {
    ...EscrowOrderFields
  }
}

query GetModeratorAccount {
  getModeratorAccount {
    ...AccountFields
  }
}

query GetRandomArbitratorAccount {
  getRandomArbitratorAccount {
    ...AccountFields
  }
}

mutation CreateEscrowOrder($input: CreateEscrowOrderInput!) {
  createEscrowOrder(data: $input) {
    id
  }
}

mutation UpdateEscrowOrderStatus($input: UpdateEscrowOrderInput!) {
  updateEscrowOrderStatus(data: $input) {
    id
    message
    price
    amount
    status
    createdAt
    updatedAt
  }
}
