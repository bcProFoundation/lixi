query AllOffer($first: Int = 20, $after: String) {
  allOffer(first: $first, after: $after) {
    totalCount
    edges {
      cursor
      node {
        id
        data {
          __typename
          ... on Post {
            ...PostFields
          }
        }
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query AllOfferByAccount(
  $first: Int = 20
  $after: String
  $offerStatus: OfferStatus!
) {
  allOfferByAccount(first: $first, after: $after, offerStatus: $offerStatus) {
    totalCount
    edges {
      cursor
      node {
        id
        data {
          __typename
          ... on Post {
            ...PostFields
          }
        }
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

mutation CreateOffer($input: CreateOfferInput!) {
  createOffer(data: $input) {
    ...PostFields
  }
}
