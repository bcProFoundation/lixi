query Offer($id: String!) {
  offer(id: $id) {
    ...OfferFields
  }
}

query AllOffer($first: Int = 20, $after: String) {
  allOffer(first: $first, after: $after) {
    totalCount
    edges {
      cursor
      node {
         ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query OfferByFilter(
  $first: Int = 20
  $after: String
  $offerFilterInput: OfferFilterInput!
) {
  offerByFilter(
    first: $first
    after: $after
    offerFilterInput: $offerFilterInput
  ) {
    totalCount
    edges {
      cursor
      node {
        ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query AllOfferByAccount(
  $first: Int = 20
  $after: String
  $offerStatus: OfferStatus!
) {
  allOfferByAccount(first: $first, after: $after, offerStatus: $offerStatus) {
    totalCount
    edges {
      cursor
      node {
         ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query allOfferActiveByAccountId(
  $first: Int = 20
  $after: String
  $accountId: Int!
) {
  allOfferActiveByAccountId(first: $first, after: $after, accountId: $accountId) {
    totalCount
    edges {
      cursor
      node {
         ...TimelineItemFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

mutation CreateOffer($input: CreateOfferInput!) {
  createOffer(data: $input) {
    ...PostFields
  }
}

mutation UpdateOffer($input: UpdateOfferInput!) {
  updateOffer(data: $input) {
    ...OfferFields
  }
}

mutation UpdateOfferHideFromHome($input: UpdateOfferHideFromHomeInput!) {
  UpdateOfferHideFromHome(data: $input) {
    ...OfferFields
  }
}

mutation UpdateOfferStatus($input: UpdateOfferStatusInput!) {
  updateOfferStatus(data: $input) {
    ...PostFields
  }
}
