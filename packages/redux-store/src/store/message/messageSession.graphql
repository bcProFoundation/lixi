fragment MessageSessionFields on MessageSession {
  id
  lixi {
    id
  }
  lixiAmount
  sessionOpen
  createdAt
  updatedAt
}

query MessageSession($id: String!) {
  messageSession(id: $id) {
    ...MessageSessionFields
  }
}

query MessageSessionByPageMessageSessionId(
  $after: String
  $before: String
  $first: Int = 20
  $last: Int
  $id: String
  $orderBy: MessageSessionOrder
  $skip: Int
) {
  allMessageSessionByPageMessageSessionId(
    after: $after
    before: $before
    first: $first
    last: $last
    id: $id
    orderBy: $orderBy
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...MessageSessionFields
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

mutation CreateMessageSession($input: CreateMessageSessionInput!) {
  createMessageSession(data: $input) {
    ...MessageSessionFields
  }
}
