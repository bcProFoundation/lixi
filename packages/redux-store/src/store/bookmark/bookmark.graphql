# import PostFields from '../post/posts.graphql
# import BasicPageInfoFields from '../../graphql/fragments/basic-page-info-fields.fragment.graphql'

fragment BookmarkFields on Bookmark {
  id
  account {
    address
    id
    name
  }
  bookmarkableId
  createdAt
  updatedAt
}

query Bookmark($id: String!) {
  bookmark(id: $id) {
    ...BookmarkFields
  }
}

query BookmarkTimeline($first: Int = 20, $after: String, $id: Int!) {
  bookmarkTimeline(first: $first, after: $after, id: $id) {
    totalCount
    edges {
      cursor
      node {
        id
        data {
          __typename
          ... on Post {
            ...PostFields
          }
        }
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

mutation CreateBookmark($input: CreateBookmarkInput!) {
  createBookmark(data: $input) {
    ...BookmarkFields
  }
}

mutation RemoveBookmark($input: RemoveBookmarkInput!) {
  removeBookmark(data: $input) {
    ...BookmarkFields
  }
}
