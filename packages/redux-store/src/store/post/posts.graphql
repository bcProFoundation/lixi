# import PostOrder from '/packages/app-lixi-api/schema.graphql'
# import PostMeiliPageInfoFields, PageInfoFields from '../../graphql/fragments/page-info-fields.fragment.graphql'

query Post($id: String!) {
  post(id: $id) {
    ...PostFields
  }
}

query PostsByPageId(
  $after: String
  $before: String
  $first: Int = 20
  $last: Int
  $orderBy: [PostOrder!]
  $id: String
  $accountId: Int
  $skip: Int
  $minBurnFilter: Int
) {
  allPostsByPageId(
    after: $after
    before: $before
    first: $first
    last: $last
    orderBy: $orderBy
    id: $id
    accountId: $accountId
    skip: $skip
    minBurnFilter: $minBurnFilter
  ) {
    totalCount
    edges {
      cursor
      node {
        ...PostFields
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

