fragment PollFields on Poll {
  postId
  question
  startDate
  endDate
  canAddOption
  singleSelect
  defaultOptions
  totalVote
  options {
    id
    option
    pollId
    danaScoreOption
    pollAnswerOnAccount {
      pollDanaScore
      accountId
    }
  }
}

fragment OfferFields on Offer {
  postId
  publicKey
  message
  noteOffer
  price
  coinPayment
  coinOthers
  marginPercentage
  localCurrency
  orderLimitMin
  orderLimitMax
  hideFromHome
  paymentMethods {
    paymentMethod {
      id
      name
    }
  }
  status
  locationId
  location {
    id
    iso2
    country
    adminNameAscii
    adminCode
    cityAscii
  }
  countryId
  country {
    name
  }
}

fragment PostFields on Post {
  id
  content
  account {
    address
    hash160
    publicKey
    id
    name
    avatar
    createCommentFee
    telegramUsername
    accountStatsOrder {
    donationAmount
    completedOrder
    uniqueTrades
  }
  }
  accountId
  page {
    avatar
    name
    id
    createPostFee
    createCommentFee
    pageAccount {
      id
      name
      address
      hash160
    }
  }
  pageId
  token {
    id
    name
    tokenId
  }
  tokenId
  repostCount
  reposts {
    accountId
    account {
      id
      name
      address
    }
  }
  dana {
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
    version
  }
  boostScore {
    boostScore
    boostUp
    boostDown
  }
  totalComments
  commentableId
  createdAt
  updatedAt
  followPostOwner
  followedPage
  followedToken
  bookmarkableId
  isBookmarked
  originalLanguage
  translations {
    id
    translateContent
    translateLanguage
  }
  imageUploadable {
    id
    uploads {
      id
      sha
      bucket
      width
      height
      cfImageId
      cfImageFilename
    }
  }
  danaViewScore
  burnedByOthers
  poll {
    ...PollFields
  }
  postOffer: offer {
    ...OfferFields
  }
}

fragment PostMeiliFields on Post {
  id
  content
  account {
    address
    hash160
    id
    name
    avatar
    createCommentFee
  }
  page {
    avatar
    name
    id
    createPostFee
    createCommentFee
    pageAccount {
      id
      name
      address
      hash160
    }
  }
  token {
    id
    name
    tokenId
  }
  reposts {
    accountId
    account {
      id
      name
      address
    }
  }
  dana {
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
    version
  }
  boostScore {
    boostScore
  }
  totalComments
  createdAt
  updatedAt
  followPostOwner
  followedPage
  followedToken
  bookmarkableId
  isBookmarked
  originalLanguage
  translations {
    id
    translateContent
    translateLanguage
  }
  imageUploadable {
    id
    uploads {
      id
      sha
      bucket
      width
      height
      cfImageId
      cfImageFilename
    }
  }
  danaViewScore
  burnedByOthers
  poll {
    ...PollFields
  }
  offer {
    ...OfferFields
  }
}

mutation createPost($input: CreatePostInput!) {
  createPost(data: $input) {
    ...PostFields
  }
}

mutation updatePost($input: UpdatePostInput!) {
  updatePost(data: $input) {
    ...PostFields
  }
}

mutation repost($input: RepostInput!) {
  repost(data: $input)
}

mutation removePost($input: RemovePostInput!) {
  removePost(data: $input) {
    ...PostFields
  }
}
