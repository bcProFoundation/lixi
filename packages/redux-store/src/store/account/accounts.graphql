query Account($id: Int!) {
  account(id: $id) {
    ...AccountFields
  }
}

query getAccountByAddress($address: String!) {
  getAccountByAddress(address: $address) {
    ...AccountFields
  }
}

query AllFollowersByPage($after: String, $first: Int = 20, $id: String!) {
  allFollowersByPage(after: $after, first: $first, id: $id) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query AllFollowersByToken($after: String, $first: Int = 20, $id: String!) {
  allFollowersByToken(after: $after, first: $first, id: $id) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query Accounts(
  $after: String
  $before: String
  $first: Int = 20
  $last: Int
  $skip: Int
) {
  allAccounts(
    after: $after
    before: $before
    first: $first
    last: $last
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query topWeekAccounts(
  $after: String
  $before: String
  $first: Int = 19
  $last: Int
  $skip: Int
) {
  topWeekAccountDanaGiven(
    after: $after
    before: $before
    first: $first
    last: $last
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query topMonthAccounts(
  $after: String
  $before: String
  $first: Int = 19
  $last: Int
  $skip: Int
) {
  topMonthAccountDanaGiven(
    after: $after
    before: $before
    first: $first
    last: $last
    skip: $skip
  ) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

fragment AccountFields on Account {
  id
  name
  address
  hash160
  mnemonicHash
  encryptedMnemonic
  encryptedSecret
  publicKey
  language
  pages {
    id
    name
  }
  followersCount
  followingsCount
  followingPagesCount
  totalDanaViewScore
  website
  description
  createCommentFee
  createdAt
  updatedAt
  avatar
  cover
  rankNumber
  rankScore
  accountDana {
    danaGiven
    danaReceived
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
  }
}

mutation createAccount($input: CreateAccountInput!) {
  createAccount(data: $input) {
    ...AccountFields
  }
}

mutation importAccount($input: ImportAccountInput!) {
  importAccount(data: $input) {
    ...AccountFields
  }
}

mutation updateAccount($input: UpdateAccountInput!) {
  updateAccount(data: $input) {
    ...AccountFields
  }
}
