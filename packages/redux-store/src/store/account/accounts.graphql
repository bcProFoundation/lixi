query Account($id: Int!) {
  account(id: $id) {
    ...AccountFields
  }
}

query getAccountByAddress($address: String!) {
  getAccountByAddress(address: $address) {
    ...AccountFields
  }
}

query AllFollowersByPage($after: String, $first: Int = 20, $id: String!) {
  allFollowersByPage(after: $after, first: $first, id: $id) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query AllFollowersByToken($after: String, $first: Int = 20, $id: String!) {
  allFollowersByToken(after: $after, first: $first, id: $id) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query Accounts($after: String, $first: Int = 20) {
  allAccounts(after: $after, first: $first) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query topWeekAccounts($after: String, $first: Int = 20, $week: Int!, $year: Int!) {
  topWeekAccountDanaGiven(after: $after, first: $first, week: $week, year: $year) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query topMonthAccounts($after: String, $first: Int = 19, $month: Int!, $year: Int!) {
  topMonthAccountDanaGiven(after: $after, first: $first, month: $month, year: $year) {
    totalCount
    edges {
      cursor
      node {
        ...AccountFields
      }
    }
    pageInfo {
      ...BasicPageInfoFields
    }
  }
}

query GetLocaleCashAvatar($accountId: Int!) {
  getLocaleCashAvatar(accountId: $accountId) 
}

fragment AccountFields on Account {
  id
  name
  address
  hash160
  mnemonicHash
  encryptedMnemonic
  encryptedSecret
  publicKey
  language
  pages {
    id
    name
  }
  followersCount
  followingsCount
  followingPagesCount
  totalDanaViewScore
  website
  description
  createCommentFee
  createdAt
  updatedAt
  avatar
  cover
  rankNumber
  rankScore
  accountDana {
    danaGiven
    danaReceived
    danaBurnUp
    danaBurnDown
    danaBurnScore
    danaReceivedUp
    danaReceivedDown
    danaReceivedScore
  }
  telegramId
  telegramUsername
  role
  accountStatsOrder {
    donationAmount
    completedOrder
    uniqueTrades
  }
  bankInfo {
    bankName
    accountNameBank
    accountNumberBank
    appName
    accountNameApp
    accountNumberApp
  }
}

mutation updateAccount($input: UpdateAccountInput!) {
  updateAccount(data: $input) {
    ...AccountFields
  }
}

mutation UpdateAccountTelegramUsername($telegramId: String!, $telegramUsername: String!) {
  updateAccountTelegramUsername(telegramId: $telegramId, telegramUsername: $telegramUsername) {
    ...AccountFields
  }
}
