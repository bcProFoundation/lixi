services:
  redis-stack:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
    volumes:
      - lixi-redis-data:/data
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: atishadbpass
      POSTGRES_DB: lixi
    volumes:
      - lixi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lixi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lixi-redis-data:
  lixi-postgres-data:
